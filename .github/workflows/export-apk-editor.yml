name: Prepare APK resource merger
on:
  push:
    branches: [keyboard-apk-tools]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned resource merger
        run: |
          curl --fail --location --output APKEditor-1.4.9.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          echo 'a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67  APKEditor-1.4.9.jar' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: APK-resource-merger
          path: APKEditor-1.4.9.jar
          if-no-files-found: error
