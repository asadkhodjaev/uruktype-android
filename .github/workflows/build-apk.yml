name: Build KeyboardUz Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check punctuation gesture
        run: |
          mkdir -p /tmp/keyboarduz-checks
          javac -d /tmp/keyboarduz-checks app/src/main/java/uz/uruktype/android/PunctuationSwipe.java checks/PunctuationSwipeCheck.java
          java -cp /tmp/keyboarduz-checks uz.uruktype.android.PunctuationSwipeCheck
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature and metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          cp "$APK" KeyboardUz_v0.8_Beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardUz-v0.8-Beta-APK
          path: KeyboardUz_v0.8_Beta.apk
          if-no-files-found: error

